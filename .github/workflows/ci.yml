name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No OPENAI_API_KEY or JWT_SECRET_KEY needed here, it is only for test.
      # every external call (openai, chromadb, bcrypt, jwt, etc.), so CI
      # stays fast and never touches a real API or a real secret.
      - name: Run tests
        run: pytest -q tests/

      # Catches exactly the kind of mistake that slipped through before:
      # a real secret committed into a tracked file (.env.example, in this
      # project's case). gitleaks scans the diff for anything matching a
      # known secret pattern and fails the build if it finds one.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Confirms the Dockerfile actually builds on every PR 
      # It catches a broken image before it's the thing someone tries to deploy.
      - name: Build image
        run: docker build -t rag-case-study:ci .
